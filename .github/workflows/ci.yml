name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API, worker and lesson (dbt on DuckDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[worker,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  stack:
    name: Full stack smoke test (Docker Compose, Postgres)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: scripts/smoke.sh http://localhost:8000
      - name: The worker image must not contain reference solutions
        run: |
          if docker compose exec -T worker sh -c 'find /srv/curriculum -path "*solution*" | grep .'; then
            echo "reference solution found in the worker image"; exit 1
          fi
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes
