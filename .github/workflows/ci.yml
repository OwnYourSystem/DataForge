name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API, worker and lesson (dbt on DuckDB, Databricks offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[worker,databricks,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  stack:
    name: Full stack smoke test (Docker Compose, Postgres)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: scripts/smoke.sh http://localhost:8000
      - name: The worker image must not contain reference solutions
        run: |
          if docker compose exec -T worker sh -c 'find /srv/curriculum -path "*solution*" | grep .'; then
            echo "reference solution found in the worker image"; exit 1
          fi
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes

  render:
    name: Render deployment images (split and single container)
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      COMPOSE_FILE: deploy/render/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Lesson runs through the public port
        run: scripts/smoke.sh http://localhost:10000/api
      - name: Only the versioned API is reachable through the web server
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/healthz)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/v1/lessons)" = 401
      - name: The public image has no dbt and no reference solutions
        run: |
          if docker compose exec -T app sh -c 'command -v dbt || pip show dbt-core 2>/dev/null | grep .'; then
            echo "dbt found in the public image"; exit 1
          fi
          if docker compose exec -T app sh -c 'find /srv/curriculum -path "*solution*" | grep .'; then
            echo "reference solution found in the public image"; exit 1
          fi
      - name: Token mode refuses the development header
        run: |
          DF_AUTH_MODE=jwt DF_AUTH_ISSUER=https://example.supabase.co/auth/v1 DF_AUTH_AUDIENCE=authenticated \
            docker compose up --detach --wait app
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Dev-User: alice' http://localhost:10000/api/v1/me)" = 401
      - run: docker compose down --volumes
      - name: Single container (free plan) runs the lesson in 512 MB
        env:
          COMPOSE_FILE: deploy/render/docker-compose.single.yml
        run: |
          docker compose up --build --detach --wait
          scripts/smoke.sh http://localhost:10000/api
          scripts/smoke.sh http://localhost:10000/api
          test "$(docker inspect -f '{{.State.OOMKilled}} {{.RestartCount}}' "$(docker compose ps -q app)")" = "false 0"
          if docker compose exec -T app sh -c 'find /srv/curriculum -path "*solution*" | grep .'; then
            echo "reference solution found in the image"; exit 1
          fi
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
          docker compose logs --no-color --tail 40 app
          docker compose down --volumes
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes

