name: Databricks live test

# Runs the lesson against a real SQL warehouse. Start it by hand from the
# Actions tab. It needs the repository secrets in docs/databricks.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-live
  cancel-in-progress: false

jobs:
  live:
    name: LAB-001 on Azure Databricks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/api
    env:
      DF_DBX_HOST: ${{ secrets.DF_DBX_HOST }}
      DF_DBX_HTTP_PATH: ${{ secrets.DF_DBX_HTTP_PATH }}
      DF_DBX_CATALOG: ${{ secrets.DF_DBX_CATALOG }}
      DF_DBX_CLIENT_ID: ${{ secrets.DF_DBX_CLIENT_ID }}
      DF_DBX_CLIENT_SECRET: ${{ secrets.DF_DBX_CLIENT_SECRET }}
      DF_DBX_GRADER_CLIENT_ID: ${{ secrets.DF_DBX_GRADER_CLIENT_ID }}
      DF_DBX_GRADER_CLIENT_SECRET: ${{ secrets.DF_DBX_GRADER_CLIENT_SECRET }}
    steps:
      - name: Stop if the secrets are not set
        working-directory: .
        run: |
          if [ -z "$DF_DBX_HOST" ]; then
            echo "::error::Set the DF_DBX_* repository secrets first. See docs/databricks.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[worker,databricks,dev]"
      - run: pytest -q tests/test_databricks_live.py -rs
