[project]
name = "dataforge"
version = "0.1.0"
description = "DataForge control plane and lab worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "sqlglot>=25,<31",
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
# The worker runs dbt. The API image does not install this group.
worker = ["dbt-duckdb>=1.9,<2"]
# Add this group to the worker for the Databricks backend.
databricks = ["dbt-databricks>=1.9,<2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
